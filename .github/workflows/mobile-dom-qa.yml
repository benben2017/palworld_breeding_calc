name: Mobile DOM QA

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Page URL to test'
        required: false
        default: 'https://palbreed.space/tools/breeding-calculator/'
        type: string
      commit_sha:
        description: 'Optional commit/deployment label'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  mobile-dom-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_URL: ${{ inputs.url }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile DOM measurements
        run: node scripts/mobile-dom-qa.mjs

      - name: Upload DOM QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dom-qa-report
          path: qa-evidence/mobile-dom-qa.json
          if-no-files-found: error
