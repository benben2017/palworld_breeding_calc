<svg width="220" height="56" viewBox="0 0 220 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PalBreed Logo</title>
  <desc id="desc">PalBreed dark gaming utility logo with a glowing breeding egg icon.</desc>
  <defs>
    <linearGradient id="egg" x1="18" y1="10" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67F8FF"/>
      <stop offset="0.48" stop-color="#22C8FF"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="word" x1="64" y1="14" x2="188" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F2A4A"/>
      <stop offset="0.55" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
