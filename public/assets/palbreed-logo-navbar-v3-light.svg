  <ellipse cx="33.7" cy="36.1" rx="4.7" ry="6.8" transform="rotate(24 33.7 36.1)" fill="#5B7FA6" opacity="0.32"/>
  <ellipse cx="31.8" cy="21.8" rx="3.5" ry="4.8" transform="rotate(48 31.8 21.8)" fill="#B8FBFF" opacity="0.24"/>
  <path d="M18.9 42.1C24.7 46.3 33.8 45.6 38.2 39.4" stroke="#9B5CFF" stroke-width="1.8" stroke-linecap="round" opacity="0.42"/>
